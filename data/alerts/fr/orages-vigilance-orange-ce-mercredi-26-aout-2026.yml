title: >-
  Orages : vigilance orange ce mercredi 26 août 2026
level: warning
content: >-
  <p>Météo-France prévoit des orages localement violents en fin de journée, avec un pic entre 18h et minuit. La Ville de Rennes appelle à la prudence et ferme ses parcs, pataugeoires et cimetières. Le marché du mail François-Mitterand est annulé. <a href="https://ici.rennes.fr/actualites/2026-08-26-orages-lille-et-vilaine-en-vigilance-orange-mercredi-26-aout-2026/" target="_blank" rel="noreferrer">En savoir plus et s'informer sur les consignes de sécurité en cas d'orage. <span class="sr-only">(lien externe)</span></a></p><p>Pour rappel, le département est également en situation de crise sécheresse, le niveau d'alerte le plus élevé. <a href="https://ici.rennes.fr/actualites/2026-08-01-secheresse-en-ille-et-vilaine-la-prefecture-place-le-departement-en-niveau-crise-toutes-les-restrict/" target="_blank" rel="noreferrer">Retrouvez les interdictions et restrictions en cours. <span class="sr-only">(lien externe)</span></a></p>
