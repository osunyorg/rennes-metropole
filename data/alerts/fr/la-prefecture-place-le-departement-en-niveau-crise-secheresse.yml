title: >-
  Le département en niveau crise sécheresse
level: warning
content: >-
  <p>La pénurie d'eau s'aggrave sur l'ensemble du pays. La Préfecture d'Ille-et-Vilaine a placé l'ensemble des secteurs « milieux aquatiques » et « eau potable » du département en situation de crise, le niveau d’alerte le plus élevé. Vigilance également pour le risque incendie. </p>
